# Per-check tuning. Every timing value here is AFTER ping compensation
# (rolling median of the player's last 20 keepalive round-trips is subtracted
# from every measurement) and MSPT scaling.
#
# likelihood-ratio: how strongly a full-strength signal from this check moves
# the player's suspicion odds. 1.0 = no effect, 2.0 = doubles the odds.
# Partial-strength signals apply a proportionally smaller ratio.
#
# experimental checks self-disable if the engine exceeds its performance
# budget, and should keep likelihood-ratio low.
config-version: 2

checks:
  spawn-reaction:
    enabled: true
    likelihood-ratio: 3.0
    # Humans reacting to a crystal appearing bottom out around 130-180ms even
    # for elite players; a compensated reaction below this is a floor hit.
    min-reaction-ms: 80
    # The stronger tell: machines are consistent. Standard deviation of the
    # last N compensated reactions below sigma-floor-ms means a machine.
    sample-window: 15
    sigma-floor-ms: 25
    # Reactions faster than this are ignored as coincidence (player was
    # already clicking); genuine pre-aimed spam produces a few of these.
    coincidence-floor-ms: 15

  place-break-cycle:
    enabled: true
    likelihood-ratio: 3.0
    # Full attack->place->attack cycle floor for a human, compensated.
    min-cycle-ms: 120
    sample-window: 20
    sigma-floor-ms: 20
    # Lag-1 autocorrelation of cycle intervals above this over the window is
    # the "fixed delay" signature; human intervals are noisy.
    autocorrelation-threshold: 0.95

  opportunity-reaction:
    enabled: true
    likelihood-ratio: 2.5
    # Onset of a valid placement spot -> place packet, compensated.
    min-reaction-ms: 100
    sample-window: 12
    sigma-floor-ms: 30
    # Geometry only runs while the player is in combat and holding crystals.
    combat-window-seconds: 10
    # Max distance at which we look for placement opportunities.
    scan-range: 5.0

  anchor-cycle:
    enabled: true
    likelihood-ratio: 3.0
    # glowstone place -> anchor interact floor, compensated.
    min-interval-ms: 90
    sample-window: 15
    sigma-floor-ms: 20
    # hotbar switch -> use within this compensated window, repeatedly, is a macro.
    min-switch-use-ms: 45

  snap-rotation:
    enabled: true
    likelihood-ratio: 2.0
    # Yaw+pitch delta (deg) in <=3 packets that lands exactly on target and
    # snaps back. Humans overshoot and micro-correct.
    min-snap-degrees: 25.0
    # Absence of sub-0.1 degree jitter during the approach counts against.
    sample-window: 10

  gcd-rotation:
    enabled: true
    experimental: true
    likelihood-ratio: 1.3
    # Rotation deltas that break the player's established sensitivity GCD only
    # during crystal actions. Sensitivity changes and cinematic camera are
    # known false-positive sources, hence experimental + low weight.
    sample-window: 30
    min-established-samples: 60

  aim-consistency:
    enabled: true
    experimental: true
    likelihood-ratio: 1.3
    # Chi-square style test on where attacks land on the crystal hitbox.
    # Needs many samples before it says anything at all.
    min-samples: 30

  # --- general combat (v2) ---
  # Reach limits themselves live in config.yml (reach:) because they are game
  # facts; the values here are only the detector's statistics.
  reach:
    enabled: true
    likelihood-ratio: 3.0
    # Fallback limit if a per-attack limit was not resolved (blocks).
    default-limit: 3.0
    # A hit must exceed limit+slop to count as a violation.
    slop: 0.1
    # A single hit past limit+hard-slop gives a small immediate nudge.
    hard-slop: 0.6
    # Sustained-evidence window: this many recent hits before the ratio speaks.
    sample-window: 20
    min-violations: 4
    violation-ratio: 0.45

  hit-while-not-looking:
    enabled: true
    likelihood-ratio: 2.0
    # Attacks landing more than this many degrees off the target center.
    max-angle: 65.0
    sample-window: 20
    min-violations: 6
    violation-ratio: 0.5

  multi-aura:
    enabled: true
    likelihood-ratio: 3.0
    # Hitting this many DISTINCT players inside the window is inhuman.
    window-ms: 250
    min-distinct-targets: 3

  attack-consistency:
    enabled: true
    experimental: true
    likelihood-ratio: 1.5
    # Autoclicker signature on the in-combat click stream. Experimental: fast
    # legit clickers (jitter/butterfly) are the false-positive source.
    sample-window: 30
    sigma-floor-ms: 12
    autocorrelation-threshold: 0.9
    # Consistency tells only apply while actually clicking fast (mean below this).
    max-mean-ms: 300
    # A sustained mean interval below this is an impossible rate outright.
    min-interval-ms: 40
    combat-window-seconds: 5

  aim-snap:
    enabled: true
    likelihood-ratio: 2.0
    # Snap-onto-player then mirror-return; same shape as crystal snap-rotation.
    min-snap-degrees: 30.0

  mace-smash:
    enabled: true
    likelihood-ratio: 2.5
    # Machine-regular wind-charge -> mace-hit combo timing.
    sample-window: 10
    sigma-floor-ms: 30
    autocorrelation-threshold: 0.9
    max-interval-ms: 1500

  bad-packets:
    enabled: true
    likelihood-ratio: 3.0
    # Rotations a vanilla client cannot send (pitch outside +/-90, NaN). A hard
    # protocol violation, independent of timing. Strong but single-family, so the
    # corroboration gate still asks for a second detection before it flags.
    strength: 0.85

  fake-criticals:
    enabled: true
    experimental: true
    likelihood-ratio: 1.6
    # Sustained fraction of hits landing during a tiny artificial "crit hop"
    # (upward velocity far below a real jump). Experimental: distribution-based.
    min-hop-velocity: 0.02
    max-hop-velocity: 0.20
    sample-window: 25
    hop-ratio-threshold: 0.65

  timer:
    enabled: true
    likelihood-ratio: 2.0
    # Movement packets arriving faster than the 20 tps cadence (client running
    # fast). Balance of the surplus over 50ms/packet; sustained surplus = timer.
    balance-limit-ms: 160.0
    balance-clamp-ms: 1000.0

  # Machine-learning layer. It scores a window of combat with the logistic model
  # (model.dat) and adds ONE corroborating signal when the score clears the
  # threshold. It never convicts alone: experimental, low weight, and it stands
  # down during lag/ping instability like every other check.
  ml:
    enabled: true
    experimental: true
    likelihood-ratio: 1.6
    # Cheat probability at or above which the model contributes a signal.
    threshold: 0.85
    # Combat actions (attacks) that make up one scored window.
    window-actions: 40
    # Feature thresholds, kept in step with the deterministic checks.
    angle-violation-threshold: 65.0
    reach-slop: 0.1
    # Write each scored window to dataset.csv for retraining. Off by default;
    # turn on, collect labelled data with /ob label, then retrain (see README).
    dataset-logging: false
